<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Private preview | Behind the Castle Walls</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">

<style>
  :root{--ink:#0b1020;--paper:#f6f4ee;--gold:#d9b169;--gold-soft:#f0dcb4;--mist:rgba(246,244,238,.68);--line:rgba(217,177,105,.28)}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;min-height:100vh;background:var(--ink);color:var(--paper);
    font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:300;
    display:flex;align-items:center;justify-content:center;padding:24px;
    background-image:
      radial-gradient(60vw 60vw at 15% 10%,rgba(217,177,105,.16),transparent 60%),
      radial-gradient(50vw 50vw at 85% 90%,rgba(96,132,255,.14),transparent 60%);
  }
  .scrim{position:fixed;inset:0;background:rgba(5,7,15,.72);backdrop-filter:blur(6px);z-index:0}
  .card{
    position:relative;z-index:1;width:100%;max-width:400px;text-align:center;
    background:rgba(11,16,32,.9);border:1px solid var(--line);border-radius:20px;
    padding:34px 28px 30px;box-shadow:0 24px 60px rgba(0,0,0,.55)
  }
  h1{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:1.32rem;line-height:1.2;margin:0 0 8px}
  p.sub{margin:0 0 22px;font-size:.92rem;color:var(--mist)}
  .mark{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;margin:0 auto 16px}
  .mark img{width:44px;height:44px;display:block}
  label{display:block;text-align:left;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600;margin:0 0 8px}
  input[type=password]{
    width:100%;min-height:48px;padding:12px 14px;font:inherit;font-size:1rem;color:var(--paper);
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.16);border-radius:12px
  }
  input[type=password]:focus{outline:2px solid var(--gold);outline-offset:2px;border-color:var(--gold)}
  button{
    width:100%;min-height:48px;margin-top:14px;padding:12px 16px;font:inherit;font-size:.95rem;font-weight:500;
    color:#0b1020;background:var(--gold);border:0;border-radius:12px;cursor:pointer;transition:.2s
  }
  button:hover{background:var(--gold-soft)}
  button:focus-visible{outline:2px solid var(--paper);outline-offset:2px}
  button[disabled]{opacity:.6;cursor:default}
  .err{margin:14px 0 0;font-size:.86rem;color:#f4b8ad;min-height:1.2em}
  .note{margin:18px 0 0;font-size:.78rem;line-height:1.5;color:rgba(246,244,238,.45)}
</style>
</head>
<body>
<div class="scrim" aria-hidden="true"></div>
<main class="card" role="dialog" aria-modal="true" aria-labelledby="gateTitle" aria-describedby="gateSub">

    <svg viewBox="0 0 512 512" width="44" height="44" role="presentation" focusable="false">

  </span>
  <h1 id="gateTitle">This preview is private</h1>
  <p class="sub" id="gateSub">Enter the passcode to view the site.</p>
  <form id="gateForm" novalidate>
    <label for="pc">Passcode</label>
    <input id="pc" name="passcode" type="password" autocomplete="current-password"
           inputmode="text" spellcheck="false" autocapitalize="off" required>
    <button type="submit" id="go">Open the site</button>
    <p class="err" id="err" role="alert" aria-live="polite"></p>
  </form>
  <p class="note">This is a preview pending approval. The link is private to you; please do not share it.</p>
</main>
<script>
(function(){
  var form=document.getElementById('gateForm'),
      field=document.getElementById('pc'),
      go=document.getElementById('go'),
      err=document.getElementById('err');

  function target(){
    var rd=new URLSearchParams(location.search).get('rd')||'/';
    if(rd.charAt(0)!=='/'||rd.charAt(1)==='/') rd='/';
    return rd;
  }

  // keep focus inside the dialog: Escape must not dismiss the gate
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){e.preventDefault();}
    if(e.key==='Tab'){
      var f=document.querySelectorAll('#pc,#go'),first=f[0],last=f[f.length-1];
      if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
      else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
    }
  });

  form.addEventListener('submit',function(e){
    e.preventDefault();
    var code=field.value;
    if(!code){err.textContent='Please enter the passcode.';field.focus();return;}
    go.disabled=true;err.textContent='';
    fetch('gate-api/check',{
      method:'POST',headers:{'X-Passcode':code},credentials:'same-origin'
    }).then(function(r){
      if(r.ok){ location.replace(target()); return null; }
      return r.json().catch(function(){return {};});
    }).then(function(j){
      if(j===null) return;
      go.disabled=false;field.value='';
      err.textContent='That passcode is not correct.';
      field.focus();
    }).catch(function(){
      go.disabled=false;err.textContent='Could not reach the server. Please try again.';
    });
  });

  field.focus();
})();
</script>
</body>
</html>
