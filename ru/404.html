<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена | Bob Chapek</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1020'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' fill='%23d9b169' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">
<style>
  :root{--ink:#0b1020;--paper:#f6f4ee;--gold:#d9b169;--mist:rgba(246,244,238,.68)}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--ink);color:var(--paper);
       font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:300;
       display:flex;align-items:center;justify-content:center;padding:24px;
       background-image:radial-gradient(60vw 60vw at 15% 10%,rgba(217,177,105,.16),transparent 60%),
                        radial-gradient(50vw 50vw at 85% 80%,rgba(96,132,255,.14),transparent 60%)}
  .box{max-width:560px;text-align:center}
  .code{font-family:Georgia,serif;font-size:clamp(4rem,18vw,7rem);color:var(--gold);line-height:1;margin:0}
  h1{font-family:Georgia,serif;font-weight:500;font-size:clamp(1.4rem,4vw,2rem);margin:14px 0 10px}
  p{color:var(--mist);margin:0 0 22px}
  .cta{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  .btn{display:inline-flex;align-items:center;min-height:46px;padding:0 22px;border-radius:999px;
       text-decoration:none;font-size:.92rem;border:1px solid rgba(217,177,105,.3);color:var(--paper);
       background:rgba(255,255,255,.04)}
  .btn.solid{background:linear-gradient(120deg,var(--gold),#e8cf9a);color:#241a05;border-color:transparent;font-weight:600}
</style>
</head>
<body>
<main class="box">
  <p class="code">404</p>
  <h1>Эта страница не является частью этой истории</h1>
  <p>Ссылка, по которой вы перешли, здесь не существует. Мемуары и биография Bob — в одном касании.</p>
  <div class="cta">
    <a class="btn solid" href="/">Перейти на главную страницу</a>
    <a class="btn" href="/#book">Предзаказать книгу</a>
  </div>
</main>
</body>
</html>
